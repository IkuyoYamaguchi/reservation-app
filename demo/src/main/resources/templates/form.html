<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規予約登録</title>
</head>
<body>
<h1>新規予約登録フォーム</h1>

<!-- データを送信するためのフォーム（送信先は /add） -->
<form action="/add" method="get">
    <label>名前：</label>
    <input type="text" name="name" required><br><br>

    <label>日付：</label>
    <input type="date" name="date" required><br><br>

    <button type="submit">予約を登録する</button>
</form>

<br>
<a href="/">トップページに戻る</a>
</body>
</html>
